# Development/staging blueprint only.
# This file intentionally stays on free-tier plans so it remains safe for preview environments.
# Production requires paid plan sizing, a backup/restore policy, and region/SLA review.
services:
  - type: keyvalue
    name: wardline-redis
    plan: free
    region: oregon

  - type: web
    name: wardline-core-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: apps/core-api/Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: wardline-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wardline-redis
          property: connectionString
      - key: WEB_BASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: CALLS_ENABLE_PROJECTION_FALLBACK
        value: "true"
      - key: RUNTIME_ACTIONS_DUAL_WRITE_LEGACY_TURNS
        value: "true"
      - key: WARDLINE_INTERNAL_API_SECRET
        sync: false
      - key: WARDLINE_APP_CREDENTIALS_KEY
        sync: false

  - type: web
    name: wardline-voice-runtime-v2
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: apps/voice-runtime-v2/Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: VOICE_RUNTIME_V2_PORT
        value: "3003"
      - key: CORE_API_HOSTPORT
        fromService:
          type: web
          name: wardline-core-api
          property: hostport
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wardline-redis
          property: connectionString
      - key: VOICE_RUNTIME_LEGACY_CALL_SYNC
        value: "true"
      - key: MANAGED_TTS_PROVIDER
        value: deepgram
      - key: DEEPGRAM_STT_MODEL
        value: nova-2-phonecall
      - key: DEEPGRAM_TTS_MODEL
        value: aura-2-thalia-en
      - key: TWILIO_MEDIA_STREAM_PATH
        value: /telephony/twilio/media
      - key: LIVEKIT_TOKEN_TTL_MINUTES
        value: "60"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WEBHOOK_PUBLIC_URL
        sync: false
      - key: WARDLINE_INTERNAL_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: LLM_PROVIDER
        value: auto

  - type: web
    name: wardline-web
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: apps/web/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_CORE_API_URL
        sync: false
      - key: NEXT_PUBLIC_VOICE_RUNTIME_URL
        sync: false
      - key: NEXT_PUBLIC_WEB_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_HOST
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

databases:
  - name: wardline-postgres
    plan: free
    region: oregon
