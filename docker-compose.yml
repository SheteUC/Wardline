version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wardline-postgres
    environment:
      POSTGRES_USER: wardline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wardline_dev}
      POSTGRES_DB: wardline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardline"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wardline-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wardline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - wardline-network

  # Core API (NestJS)
  core-api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    container_name: wardline-core-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://wardline:${POSTGRES_PASSWORD:-wardline_dev}@postgres:5432/wardline
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wardline-network
    restart: unless-stopped

  # Voice Runtime V2
  voice-runtime-v2:
    build:
      context: .
      dockerfile: apps/voice-runtime-v2/Dockerfile
    container_name: wardline-voice-runtime-v2
    environment:
      VOICE_RUNTIME_V2_PORT: 3003
      CORE_API_BASE_URL: http://core-api:3001
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
    ports:
      - "3003:3003"
    depends_on:
      - core-api
    networks:
      - wardline-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  wardline-network:
    driver: bridge
