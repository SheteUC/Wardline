services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wardline-postgres
    environment:
      POSTGRES_USER: wardline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wardline_dev}
      POSTGRES_DB: wardline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardline"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wardline-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wardline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - wardline-network

  # Core API (NestJS)
  core-api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    container_name: wardline-core-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://wardline:${POSTGRES_PASSWORD:-wardline_dev}@postgres:5432/wardline
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wardline-network
    restart: unless-stopped

  # Voice Runtime V2
  voice-runtime-v2:
    build:
      context: .
      dockerfile: apps/voice-runtime-v2/Dockerfile
    container_name: wardline-voice-runtime-v2
    environment:
      VOICE_RUNTIME_V2_PORT: 3003
      CORE_API_BASE_URL: http://core-api:3001
      REDIS_URL: redis://redis:6379
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
    ports:
      - "3003:3003"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/health', timeout=2)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 50s
    depends_on:
      core-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wardline-network
    restart: unless-stopped

  # Web App (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: wardline-web
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      NEXT_PUBLIC_WEB_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      CORE_API_INTERNAL_BASE_URL: http://core-api:3001
      NEXT_PUBLIC_CORE_API_URL: http://localhost:3001
      NEXT_PUBLIC_VOICE_RUNTIME_URL: http://localhost:3003
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://app.posthog.com}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      core-api:
        condition: service_healthy
      voice-runtime-v2:
        condition: service_healthy
    networks:
      - wardline-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  wardline-network:
    driver: bridge
