name: Test and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  PNPM_VERSION: "8"
  CI: "true"

jobs:
  lint-and-security:
    name: Lint and Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/voice-runtime-v2/requirements.txt

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace lint
        run: pnpm lint

      - name: Run Node dependency audit
        run: pnpm security:audit

      - name: Run Python dependency audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r apps/voice-runtime-v2/requirements.txt

  validate:
    name: Smoke Validation
    runs-on: ubuntu-latest
    needs: lint-and-security
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/wardline_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      PORT: "3001"
      CORE_API_BASE_URL: http://localhost:3001
      WEB_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NEXT_PUBLIC_CORE_API_URL: http://localhost:3001
      NEXT_PUBLIC_VOICE_RUNTIME_URL: http://localhost:3003
      NEXT_PUBLIC_WEB_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_ci_placeholder
      NEXT_PUBLIC_POSTHOG_KEY: phc_ci_placeholder
      NEXT_PUBLIC_POSTHOG_HOST: https://app.posthog.com
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      AZURE_OPENAI_KEY: azure_ci_placeholder
      AZURE_OPENAI_ENDPOINT: https://example.openai.azure.com/
      AZURE_OPENAI_DEPLOYMENT: gpt-4o-mini
      TWILIO_ACCOUNT_SID: AC_ci_placeholder
      TWILIO_AUTH_TOKEN: twilio_ci_placeholder
      TWILIO_PHONE_NUMBER: "+15555550123"
      VOICE_RUNTIME_V2_PUBLIC_URL: https://example.ngrok.app
      LIVEKIT_URL: wss://example.livekit.cloud
      LIVEKIT_API_KEY: livekit_ci_placeholder
      LIVEKIT_API_SECRET: livekit_secret_ci_placeholder
      DEEPGRAM_API_KEY: deepgram_ci_placeholder
      MOCK_ATHENAHEALTH_TOKEN: mock-athena-token

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wardline_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/voice-runtime-v2/requirements.txt

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install V2 voice dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/voice-runtime-v2/requirements.txt

      - name: Generate Prisma client
        run: pnpm --filter @wardline/db generate

      - name: Apply DB migrations and verify AuditLog immutability
        run: pnpm test:smoke:db

      - name: Run smoke validation
        run: pnpm test:smoke

      - name: Install Playwright browser
        run: pnpm --filter @wardline/web exec playwright install --with-deps chromium

      - name: Run web browser smoke test
        run: pnpm test:e2e:web

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.wardline.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Voice Runtime V2 image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/wardline-voice-v2:$IMAGE_TAG -f apps/voice-runtime-v2/Dockerfile .
          docker push $ECR_REGISTRY/wardline-voice-v2:$IMAGE_TAG

      - name: Build and push Core API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/wardline-api:$IMAGE_TAG -f apps/core-api/Dockerfile .
          docker push $ECR_REGISTRY/wardline-api:$IMAGE_TAG

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster wardline-staging --service voice-runtime-v2 --force-new-deployment
          aws ecs update-service --cluster wardline-staging --service core-api --force-new-deployment

      - name: Deploy web to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://wardline.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Voice Runtime V2 image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/wardline-voice-v2:$IMAGE_TAG -f apps/voice-runtime-v2/Dockerfile .
          docker push $ECR_REGISTRY/wardline-voice-v2:$IMAGE_TAG

      - name: Build and push Core API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/wardline-api:$IMAGE_TAG -f apps/core-api/Dockerfile .
          docker push $ECR_REGISTRY/wardline-api:$IMAGE_TAG

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster wardline-prod --service voice-runtime-v2 --force-new-deployment
          aws ecs update-service --cluster wardline-prod --service core-api --force-new-deployment
          aws ecs wait services-stable --cluster wardline-prod --services voice-runtime-v2 core-api

      - name: Deploy web to Vercel production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
          working-directory: ./apps/web
